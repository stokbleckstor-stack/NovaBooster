name: Build NOVA BOOST APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip -q *.zip -d source

      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle.kts -o -name settings.gradle | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Project Gradle tidak ditemukan"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-BOOST-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
